[package]
name = "ophanim-node"
version = "0.1.0"
edition = "2021"
authors = ["Ophanim AI Team"]
description = "Lightweight governed endpoint daemon for Ophanim AI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
