global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ophanim-core
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: ophanim-core

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
